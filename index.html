<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="app-header">
            <h1>📦 Product Inventory Manager</h1>
            <p class="subtitle">TypeScript & DOM Manipulation Assignment</p>
        </header>

        <!-- Summary Cards Section -->
        <section class="summary-section">
            <div class="summary-card">
                <span class="card-icon">🏷️</span>
                <div class="card-info">
                    <h3>Total Products</h3>
                    <p id="total-products" class="card-value">0</p>
                </div>
            </div>
            <div class="summary-card">
                <span class="card-icon">💰</span>
                <div class="card-info">
                    <h3>Total Inventory Value</h3>
                    <p id="total-inventory-value" class="card-value">$0.00</p>
                </div>
            </div>
        </section>

        <!-- Main Content Section: Form and Table -->
        <main class="main-content">
            <!-- Add Product Form Card -->
            <section class="form-card">
                <h2>Add New Product</h2>
                <form id="product-form" novalidate>
                    <!-- Error Message Display -->
                    <div id="error-message" class="error-box hidden"></div>

                    <div class="form-group">
                        <label for="product-name">Product Name <span class="required">*</span></label>
                        <input type="text" id="product-name" placeholder="e.g. Wireless Mouse" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="product-price">Price ($) <span class="required">*</span></label>
                        <input type="number" id="product-price" placeholder="e.g. 29.99" step="0.01" min="0.01">
                    </div>

                    <div class="form-group">
                        <label for="product-qty">Quantity <span class="required">*</span></label>
                        <input type="number" id="product-qty" placeholder="e.g. 10" step="1" min="1">
                    </div>

                    <button type="button" id="add-product-btn" class="btn btn-primary">➕ Add Product</button>
                </form>
            </section>

            <!-- Inventory Table Card -->
            <section class="table-card">
                <div class="table-header-row">
                    <h2>Inventory List</h2>
                </div>

                <div class="table-responsive">
                    <table class="inventory-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total Value</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-tbody">
                            <!-- Dynamically populated by TypeScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Empty State Message -->
                <div id="empty-state" class="empty-state">
                    <p>📭 No products in inventory yet. Use the form above to add some!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Compiled JavaScript File -->
    <script src="script.js" defer></script>
</body>
</html>
